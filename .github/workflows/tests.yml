name: Tests

# Controls when the action will run.
on:
  workflow_call:
    inputs:
      mcsas3_ref:
        description: McSAS3 ref to check out. Defaults to main.
        required: false
        type: string
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      mcsas3_ref:
        description: McSAS3 ref to check out. Defaults to main.
        required: false
        type: string

jobs:
  # defining this job separately allows to refer to it later as job.needs dependency
  tests:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python_arch: ['x64']
        python:
          - [3, 12]
          - [3, 13]
          - [3, 14]
        # os: ['ubuntu', 'windows', 'macos']
        os: ['windows']
    env:
      PYTHON: ${{ join(matrix.python, '.') }}  # e.g. '3.12'
      TOX_ENV: ${{ format('{0}{1}', 'py', join(matrix.python, '')) }}  # e.g. 'py312'
      MCSAS3GUI_MCSAS3_SRC: ${{ github.workspace }}/McSAS3/src
    runs-on: ${{ format('{0}-latest', matrix.os) }}
    name: "Test py-${{ join(matrix.python, '.') }} (${{ matrix.os }})"
    steps:

      - name: Checking out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out McSAS3
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/McSAS3
          path: McSAS3
          ref: ${{ inputs.mcsas3_ref || 'main' }}

      - name: Setting up Python ${{ env.PYTHON }}
        uses: actions/setup-python@v6
        with:
          python-version: '${{ env.PYTHON }}'
          architecture: '${{ matrix.python_arch }}'
          cache: pip
          cache-dependency-path: |
            ci/requirements.txt
            tests/requirements.txt

      - name: Install required system packages
        shell: sh
        run: |
          PLATFORM="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          REQFN="ci/requirements_$PLATFORM.txt"
          if [ "$PLATFORM" = "linux" ] && [ -f "$REQFN" ]; then
            sudo apt-get update  # update package DB, to avoid outdated lists
            sudo apt-get -y install $(sed -e '/^\s*#/d' "$REQFN")
          elif [ "$PLATFORM" = "windows" ] && [ -f "$REQFN" ]; then
            choco install $(sed -e '/^\s*#/d' "$REQFN")
          else
            echo "macro sys_install_req(): platform '$PLATFORM' not implemented yet."
          fi

      - name: Install dependencies
        shell: sh
        run: |
          [ -d "/c/miniconda" ] && /c/miniconda/condabin/activate.bat
          python -m pip install --upgrade pip
          python -m pip install --progress-bar=off -r ci/requirements.txt

      - name: Show installed package details
        shell: sh
        run: |
          [ -d "/c/miniconda" ] && /c/miniconda/condabin/activate.bat
          virtualenv --version
          pip --version
          tox --version
          pip list --format=freeze

      - name: Check
        shell: sh
        run: tox -e check -v

      - name: Run tests
        shell: sh
        run: |
          [ -d "/c/miniconda" ] && /c/miniconda/condabin/activate.bat
          tox -e ${{ env.TOX_ENV }} -v

      - name: Rename coverage data uniquely
        shell: sh
        run: mv .coverage coverage.${{ env.TOX_ENV }}.${{ matrix.os }}

      - name: Upload coverage data for next step
        uses: actions/upload-artifact@v4
        with:
          name: coverage.${{ env.TOX_ENV }}.${{ matrix.os }}
          path: coverage.*
